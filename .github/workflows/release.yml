name: Release

on:
  push:
    tags:
      - "v*"

# This workflow is tag-only again: the `pull_request` trigger and its
# `publish-dry-run` job are removed. Cost of that, measured: the dry run failed
# 4 of its 91 PR runs over the last 30 days, and run 36742445432 (2026-09-30)
# caught real breakage -- `cargo-budget-report` failed to verify its package
# tarball. It was not a required status check, so those failures were mergeable
# anyway; restoring the dry run *as required* is a better fix than leaving it
# off. See the PR body.
jobs:
  # Release artifacts are published from a tagged commit, which is not covered by
  # the Code Quality workflow's `push`/`pull_request` triggers on main. Without
  # this job a tag pointing at a commit that fails the workspace gates could
  # still build and publish a binary, so every publishable job below waits on it.
  verify:
    name: Verify
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Matches .github/workflows/quality.yml and budget.yml, including the
          # wasm targets the contract tests build against.
          toolchain: 1.92.0
          components: rustfmt, clippy
          targets: wasm32v1-none wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test --workspace` registers the contract fixtures from
      # `target/wasm32v1-none/release/`, so the workspace tests only pass once
      # the contracts are built the same way budget.yml builds them.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 28.1.0
          STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
        run: |
          set -euo pipefail
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          echo "${STELLAR_CLI_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/stellar" /usr/local/bin/stellar
          stellar --version

      - name: Build Contracts
        run: |
          set -euo pipefail
          for package in amm-pool-contract host-function-contract bloat-contract; do
            stellar contract build --package "${package}" --locked
          done

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Check module reachability
        run: scripts/check-module-reachability.sh

      - name: Check CLI documentation
        run: bash scripts/check-cli-docs.sh

      - name: Check documented compatibility pins
        run: .github/scripts/check-compatibility-docs.sh

  build:
    name: Build
    needs: verify
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cargo-budget-report
            name: cargo-budget-report-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: cargo-budget-report
            name: cargo-budget-report-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: cargo-budget-report
            name: cargo-budget-report-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cargo-budget-report.exe
            name: cargo-budget-report-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
          target: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev

      - name: Build
        run: cargo build -p cargo-budget-report --release --target ${{ matrix.target }}

      - name: Run Platform-Sensitive Tests
        run: |
          # Note: Contract WASM builds and network Tier B tests require specific Linux toolchains/network sandboxing
          # and are therefore excluded on non-Linux runners; only cargo-budget-report --lib and budget-macros
          # are portable across all four OS targets.
          cargo test -p cargo-budget-report --lib
          cargo test -p budget-macros

      - name: Rename Artifact
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.name }}

      - name: Generate man page
        run: cargo run -p cargo-budget-report --bin generate-manpage -- cargo-budget-report.1

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  checksums:
    name: Generate Checksums
    needs: [verify, build]
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0

      - name: Generate man page
        run: cargo run -p cargo-budget-report --bin generate-manpage -- cargo-budget-report.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cargo-budget-report-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum cargo-budget-report-* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            cargo-budget-report-*
            cargo-budget-report.1
            SHA256SUMS

  publish:
    name: Publish to crates.io
    needs: [verify, build, checksums]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0

      - name: Verify tag version matches crate versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(awk '/^\[workspace\.package\]/ {found=1} found && /^version = / {print; exit}' Cargo.toml | sed 's/.*= "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "ERROR: Tag v$TAG_VERSION does not match workspace version $WORKSPACE_VERSION"
            exit 1
          fi
          echo "Workspace version $WORKSPACE_VERSION matches tag v$TAG_VERSION"

      - name: Publish budget-macros
        run: cargo publish -p budget-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish cargo-budget-report
        run: cargo publish -p cargo-budget-report
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
