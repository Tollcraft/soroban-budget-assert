name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  publish-dry-run:
    name: Dry Run Publish Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Dry run budget-macros
        run: cargo publish -p budget-macros --dry-run

      - name: Dry run cargo-budget-report
        run: cargo publish -p cargo-budget-report --dry-run

  build:
    name: Build
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cargo-budget-report
            name: cargo-budget-report-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: cargo-budget-report
            name: cargo-budget-report-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: cargo-budget-report
            name: cargo-budget-report-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cargo-budget-report.exe
            name: cargo-budget-report-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          target: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev

      - name: Build
        run: cargo build -p cargo-budget-report --release --target ${{ matrix.target }}

      - name: Rename Artifact
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.name }}

      - name: Generate man page
        run: cargo run -p cargo-budget-report --bin generate-manpage -- cargo-budget-report.1

      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  checksums:
    name: Generate Checksums
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Generate man page
        run: cargo run -p cargo-budget-report --bin generate-manpage -- cargo-budget-report.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cargo-budget-report-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum cargo-budget-report-* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            cargo-budget-report-*
            cargo-budget-report.1
            SHA256SUMS

  publish:
    name: Publish to crates.io
    needs: [build, checksums]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify tag version matches crate versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(awk '/^\[workspace\.package\]/ {found=1} found && /^version = / {print; exit}' Cargo.toml | sed 's/.*= "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "ERROR: Tag v$TAG_VERSION does not match workspace version $WORKSPACE_VERSION"
            exit 1
          fi
          echo "Workspace version $WORKSPACE_VERSION matches tag v$TAG_VERSION"

      - name: Publish budget-macros
        run: cargo publish -p budget-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish cargo-budget-report
        run: cargo publish -p cargo-budget-report
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
