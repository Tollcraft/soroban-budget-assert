name: Soroban Budget Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  budget-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none wasm32-unknown-unknown

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev

      # No Stellar CLI or testnet identity is installed here on purpose.
      # The Tier B step below is mocked, so nothing in this job reaches the
      # network, and `secrets` are withheld from pull_request runs on forks —
      # where every contribution to this repo comes from. Gating the job on a
      # secret it never uses made it fail on every contributor PR.
      #
      # To restore real Tier B reporting, add `if: github.event_name == 'push'`
      # to the reinstated CLI/identity steps and un-comment the budget-report
      # invocations below, so fork PRs still run Tier A only.

      - name: Build Contracts
        run: cargo build -p amm-pool-contract --release --target wasm32v1-none

      - name: Run Budget Macros Test (Tier A)
        run: cargo test

      - name: Run Budget Report (Tier B)
        run: |
          # Optionally, this uses budget.toml to populate fields instead of args
          # Ensure your repository has budget.toml configured for this to work
          # and ALICE_SECRET_KEY is in your Github Secrets for deploying to testnet
          # cargo run --bin cargo-budget-report -- budget-report --format md >> "$GITHUB_STEP_SUMMARY"
          # cargo run --bin cargo-budget-report -- budget-report --json > current_report.json

          # Mocking the JSON output for the demo so CI passes without testnet secrets:
          echo '[{"package":"amm-pool-contract","function":"do_expensive_work","metric":"CPU Instructions","value":1000000},{"package":"amm-pool-contract","function":"do_expensive_work","metric":"Read Bytes","value":4096}]' > current_report.json

      - name: Publish Step Summary
        run: |
          {
            echo "# Workspace Budget Report"
            echo ""
            echo "| Function | CPU Instructions | Read Bytes | Write Bytes |"
            echo "|----------|-----------------|------------|-------------|"
            echo "| do_expensive_work | 1,000,000 inst. | 4,096 B | - |"
            echo ""
            echo "---"
            echo "_Simulated resource amounts, not fees._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Budget Report
        uses: actions/upload-artifact@v7
        with:
          name: budget-report
          path: current_report.json

  record-history:
    needs: budget-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download Budget Report
      uses: actions/download-artifact@v8
      with:
        name: budget-report

    # Appends one point to history.json on gh-pages ONLY when the uploaded
    # report is a genuine network measurement. The mocked Tier B step in
    # budget-check currently echoes a hardcoded placeholder; without this gate
    # the published cost chart accumulates identical fabricated points stamped
    # with real commit SHAs and timestamps — indistinguishable from real data.
    # Historical entries that fail the same gate are purged. Declining to
    # record is not a failure: the job exits successfully either way.
    - name: Record History Dataset
      run: |
        set -euo pipefail

        # Configure Git for the bot
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Save report to temp location so it survives the checkout
        cp current_report.json /tmp/current_report.json

        # ── Measurement gate ─────────────────────────────────────────----
        # Whether this report gets recorded is decided by inspecting the
        # report itself, never by assuming which step produced it. A genuine
        # `cargo budget-report --json` run emits every successfully simulated
        # function with ALL FOUR metric rows (CPU Instructions, Read Bytes,
        # Write Bytes, WASM Bytes), each carrying a numeric value; simulation
        # failures emit null-valued stubs or no rows at all. Both producer
        # shapes are accepted: the bare array emitted today and the
        # {schema_version, snapshots} wrapped form. On top of those structural
        # checks, the exact demo payload echoed by the mocked Tier B step is
        # fingerprint-matched, so even a structurally complete copy of it
        # stays blocked.
        cat > /tmp/measurement_gate.jq <<'JQDEFS'
        def rows:
          if type == "object" and ((.snapshots | type) == "array")
          then .snapshots else . end;

        def fingerprint:
          [ rows[] | [.package, .function, .metric, .value] ] | sort | tostring;

        def known_placeholder_fingerprint:
          [
            ["amm-pool-contract", "do_expensive_work", "CPU Instructions", 1000000],
            ["amm-pool-contract", "do_expensive_work", "Read Bytes", 4096]
          ] | sort | tostring;

        def complete_metric_sets:
          [ (rows
             | group_by((.package // "") + "\u0000" + (.function // ""))[]
             | [.[].metric] | unique | sort) ]
          | all(. == ["CPU Instructions", "Read Bytes", "WASM Bytes", "Write Bytes"]);

        def is_real_measurement:
          (rows | type) == "array"
          and (rows | length) > 0
          and all(rows[]; (.value | type) == "number")
          and complete_metric_sets
          and ((fingerprint) != known_placeholder_fingerprint);

        # Sanitize past entries with the same gate the new report must pass,
        # then append the new point only when it is a real measurement.
        # ($incoming is the slurpfile wrapper around the single report.)
        . as $old
        | ([ $old[] | select(.data | is_real_measurement) ]) as $clean
        | ($incoming[0] | is_real_measurement) as $recorded
        | {
            purged: (($old | length) - ($clean | length)),
            recorded: $recorded,
            history: (
              $clean +
              (if $recorded
               then [{ commit: $commit, timestamp: $time, data: $incoming[0] }]
               else [] end)
            )
          }
        JQDEFS

        # Clean up any modified files from testing before switching branches
        git reset --hard
        git clean -fd

        # Fetch and checkout the gh-pages branch, or create it if missing
        git fetch origin gh-pages || true
        git checkout gh-pages || git checkout -b gh-pages
        git pull origin gh-pages || true

        # Initialize history.json if it doesn't exist
        if [ ! -f history.json ]; then
          echo '[]' > history.json
        fi

        # Sanitize + append in one atomic pass. Every pre-existing entry must
        # clear the same gate as the new report; anything else was recorded
        # from a placeholder and is removed rather than left looking like a
        # real measurement. This lands as a normal forward commit on gh-pages:
        # no force-push, no rewrite of published history.
        jq --arg commit "$GITHUB_SHA" \
           --arg time "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
           --slurpfile incoming /tmp/current_report.json \
           -f /tmp/measurement_gate.jq \
           history.json > /tmp/history_result.json

        purged=$(jq '.purged' /tmp/history_result.json)
        if jq -e '.recorded' /tmp/history_result.json > /dev/null; then
          recorded=1
          echo "Report passed the measurement gate; recording it."
        else
          recorded=0
          echo "::notice::current_report.json failed the measurement gate (not a network-measured report). Declining to append it to history.json — this is not a failure."
        fi
        if [ "$purged" -gt 0 ]; then
          echo "::notice::Purged $purged historical entries whose payloads fail the measurement gate (pre-existing placeholder/mock points)."
        fi

        jq '.history' /tmp/history_result.json > history_new.json
        mv history_new.json history.json

        # Commit and push to gh-pages branch. Declining to record still pushes
        # any purge that happened; if neither happened there is nothing to do.
        git add history.json
        if git diff --cached --quiet; then
          echo "history.json unchanged; nothing to commit."
        else
          if [ "$recorded" -eq 1 ]; then
            msg="chore: record budget history for $GITHUB_SHA"
          else
            msg="chore: decline non-measured report for $GITHUB_SHA"
          fi
          if [ "$purged" -gt 0 ]; then
            git commit -m "$msg" -m "Purged $purged historical entries whose payloads fail the measurement gate (they were recorded from the mocked Tier B placeholder before this job was gated; see https://github.com/Tollcraft/soroban-budget-assert/issues/442)."
          else
            git commit -m "$msg"
          fi
        fi
        git push origin gh-pages
