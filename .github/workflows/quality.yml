name: Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check module reachability
        # Fail if any `.rs` file under a crate's `src/` is not declared in
        # the module tree. Such files are never read by the compiler, so
        # clippy/tests report success on them by never looking at them
        # (issue #451).
        run: scripts/check-module-reachability.sh
      - name: Check for unused dependencies
        run: |
          cargo install cargo-machete --version 0.6.2 --locked
          cargo machete
