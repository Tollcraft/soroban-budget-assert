name: Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy, llvm-tools

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-llvm-cov

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev

      - name: Generate Coverage
        run: |
          cargo llvm-cov --workspace \
            --exclude amm-pool-contract \
            --exclude host-function-contract \
            --lcov --output-path lcov.info \
            2>&1 | tee coverage-summary.txt

      - name: Publish Step Summary
        run: |
          {
            echo "# Coverage Report"
            echo ""
            echo "| Crate | Lines | Covered | Coverage |"
            echo "|-------|------:|--------:|---------:|"
            grep '^[a-zA-Z]' coverage-summary.txt | grep -v '^Total' | while IFS= read -r line; do
              crate=$(echo "$line" | awk '{print $1}')
              functions_pct=$(echo "$line" | awk '{print $2}')
              lines_pct=$(echo "$line" | awk '{print $NF}')
              # The text summary format varies; extract what we can
              echo "| \`$crate\` | - | - | $lines_pct |"
            done
            echo ""
            # Print the total line if present
            total_line=$(grep '^Total' coverage-summary.txt || true)
            if [ -n "$total_line" ]; then
              total_pct=$(echo "$total_line" | awk '{print $NF}')
              echo "**Total: $total_pct**"
            fi
            echo ""
            echo "---"
            echo "_Generated by \`cargo-llvm-cov\`. \`amm-pool-contract\` excluded (WASM target, not instrumentable)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: lcov.info
