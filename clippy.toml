# Clippy configuration for soroban-budget-assert.
#
# Decision: the default lint set is right for this repository. `CONTRIBUTING.md`
# gates on `cargo clippy --workspace --all-targets -- -D warnings`, and the
# workspace passes that on defaults, so nothing here relaxes or adds a lint.
#
# What this file does do is pin the tunable thresholds that the default lints
# read. They are set to their current upstream defaults on purpose: if a future
# clippy release changes a default, the gate stays where it is today instead of
# moving under an unchanged source tree. Same reasoning as `rustfmt.toml`.
#
# Not set here:
#   * `msrv` -- the toolchain is pinned to 1.91.0, but the project declares no
#     `rust-version` or supported minimum Rust version. The pin makes the lint
#     environment reproducible; it does not establish an MSRV, so setting one
#     here would still silence version-gated suggestions based on an
#     uncommunicated support commitment.
#   * `avoid-breaking-exported-api` -- left at its default (`true`). The crates
#     here are a proc-macro library and a CLI binary, neither of which has an
#     API surface stable enough to be worth linting against.

# Why: Pins maximum function arguments (default: 7) before triggering `clippy::too_many_arguments`.
# Freezing this threshold prevents Clippy upstream changes from breaking builds on functions with 7 arguments.
too-many-arguments-threshold = 7

# Why: Pins complex type nesting score (default: 250) before triggering `clippy::type_complexity`.
# Ensures type definitions in proc-macro expansion remain within historical complexity limits.
type-complexity-threshold = 250

# Why: Pins minimum matching prefix/suffix count (default: 3) before triggering `clippy::enum_variant_names`.
# Prevents enums with 2 matching prefixes from being flagged if upstream defaults tighten.
enum-variant-name-threshold = 3

# Why: Pins single-character binding name threshold (default: 4) before triggering `clippy::many_single_char_names`.
# Allows short variable names in math/macro expressions without triggering lint failures.
single-char-binding-names-threshold = 4
