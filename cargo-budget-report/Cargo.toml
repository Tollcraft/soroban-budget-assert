[package]
name = "cargo-budget-report"
version.workspace = true
edition.workspace = true
description = "Cargo subcommand that reports Soroban smart-contract resource costs across a workspace."
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["soroban", "stellar", "testing", "budget", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.21"
stellar-xdr = { version = "27.0.0", features = ["std", "base64", "serde"] }
anyhow = "1.0.103"
toml = "1.1"
cargo_metadata = "0.23"
wasmparser = "0.254.0"
indicatif = "0.18.6"
csv = "1.3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
