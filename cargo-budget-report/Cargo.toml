[package]
name = "cargo-budget-report"
version.workspace = true
edition.workspace = true
description = "Cargo subcommand that reports Soroban smart-contract resource costs across a workspace."
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.14"
stellar-xdr = { version = "22.1.0", features = ["std", "base64", "serde"] }
anyhow = "1.0.103"
toml = "0.8"
cargo_metadata = "0.18"
wasmparser = "0.116.1"
indicatif = "0.17.8"
csv = "1.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
stellar-strkey = "0.0.9"
hex = "0.4"
base64 = "0.21"
rand = "0.8"
sha2 = "0.10"
icu_properties = "=2.1.0"
icu_collections = "=2.1.0"
icu_locale_core = "=2.1.0"
icu_normalizer = "=2.1.0"
icu_normalizer_data = "=2.1.0"
icu_properties_data = "=2.1.0"
icu_provider = "=2.1.0"
ed25519-dalek = "2.2.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
mockito = "1.7.2"
